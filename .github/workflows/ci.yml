name: LICA CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify repository structure
        run: |
          echo "Checking LICA repository..."

          test -f README.md
          test -f environment.yml
          test -f LICENSE
          test -f "CITATION .cff"

          test -d Data
          test -d Figures
          test -d Notebooks
          test -d Scripts

          echo "Repository structure verified successfully."

      - name: Verify Python
        run: |
          python --version
          python -c "print('Python environment successfully verified.')"

      - name: Verify LICA data
        run: |
          test -f Data/lica_raw_score_matrix.csv
          echo "LICA score matrix found."

      - name: Verify reproducibility scripts
        run: |
          test -f Scripts/20_reproducibility_pipeline_runner.py
          echo "Python reproducibility pipeline found."

      - name: Final status
        run: |
          echo "=============================================="
          echo "LICA CI CHECK: PASSED"
          echo "Zenodo DOI: 10.5281/zenodo.23168595"
          echo "=============================================="
