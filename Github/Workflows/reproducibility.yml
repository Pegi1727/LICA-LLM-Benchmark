
name: Reproducibility Check
on: [push, pull_request]
jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: DVC Pull
        run: dvc pull
      - name: Reproduce Results
        run: dvc repro
