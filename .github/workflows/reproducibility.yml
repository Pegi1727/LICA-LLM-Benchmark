name: LICA Reproducibility Check

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  reproducibility:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # 3. PIP
      # ============================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      # ============================================================
      # 4. REQUIREMENTS
      # ============================================================

      - name: Verify requirements.txt
        run: |
          test -f requirements.txt
          echo "✓ requirements.txt found"


      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt


      # ============================================================
      # 5. VERIFY PYTHON PACKAGES
      # ============================================================

      - name: Verify Python environment
        run: |
          python - <<'PY'
          import numpy
          import pandas
          import scipy
          import sklearn
          import statsmodels
          import matplotlib
          import seaborn
          import openpyxl
          import pingouin

          print("==========================================")
          print("LICA PYTHON ENVIRONMENT")
          print("==========================================")

          print("NumPy:", numpy.__version__)
          print("Pandas:", pandas.__version__)
          print("SciPy:", scipy.__version__)
          print("Scikit-learn:", sklearn.__version__)
          print("Statsmodels:", statsmodels.__version__)
          print("Matplotlib:", matplotlib.__version__)
          print("Seaborn:", seaborn.__version__)
          print("OpenPyXL:", openpyxl.__version__)
          print("Pingouin:", pingouin.__version__)

          print("")
          print("✓ All Python packages imported successfully.")
          PY


      # ============================================================
      # 6. SHOW REPOSITORY STRUCTURE
      # ============================================================

      - name: Show repository structure
        run: |
          echo "=========================================="
          echo "LICA REPOSITORY STRUCTURE"
          echo "=========================================="

          pwd

          echo ""
          echo "Top-level files and folders:"
          ls -la

          echo ""
          echo "Data:"
          find Data -maxdepth 3 -type f | sort || true

          echo ""
          echo "Figures:"
          find Figures -maxdepth 2 -type f | sort || true

          echo ""
          echo "Notebooks:"
          find Notebooks -maxdepth 2 -type f | sort || true

          echo ""
          echo "Scripts:"
          find Scripts -maxdepth 3 -type f | sort || true

          echo ""
          echo "Configs:"
          find configs -maxdepth 2 -type f | sort || true


      # ============================================================
      # 7. VERIFY MAIN DIRECTORIES
      # ============================================================

      - name: Verify repository directories
        run: |
          test -d Data
          test -d Figures
          test -d Notebooks
          test -d Scripts
          test -d configs

          echo "✓ Data/"
          echo "✓ Figures/"
          echo "✓ Notebooks/"
          echo "✓ Scripts/"
          echo "✓ configs/"


      # ============================================================
      # 8. VERIFY DATA
      # ============================================================

      - name: Verify LICA data
        run: |

          test -d Data/Raw

          echo "✓ Data/Raw exists"

          test -f Data/Raw/lica_raw_score_matrix.csv

          echo "✓ Data/Raw/lica_raw_score_matrix.csv found"

          echo ""
          echo "Data file:"
          ls -lh Data/Raw/lica_raw_score_matrix.csv

          echo ""
          echo "First rows:"
          head -n 10 Data/Raw/lica_raw_score_matrix.csv


      # ============================================================
      # 9. VERIFY DATA STRUCTURE
      # ============================================================

      - name: Validate score matrix
        run: |
          python - <<'PY'

          import pandas as pd

          path = "Data/Raw/lica_raw_score_matrix.csv"

          df = pd.read_csv(path)

          print("==========================================")
          print("LICA SCORE MATRIX VALIDATION")
          print("==========================================")

          print("Rows:", len(df))
          print("Columns:", len(df.columns))

          print("")
          print("Columns:")
          for col in df.columns:
              print("-", col)

          print("")
          print("Missing values:")
          print(df.isnull().sum())

          print("")
          print("✓ Score matrix successfully loaded.")

          PY


      # ============================================================
      # 10. VERIFY CORE FILES
      # ============================================================

      - name: Verify core repository files
        run: |

          test -f README.md
          test -f LICENSE
          test -f environment.yml
          test -f requirements.txt
          test -f dvc.yml
          test -f mkdocs.yml

          echo "✓ README.md"
          echo "✓ LICENSE"
          echo "✓ environment.yml"
          echo "✓ requirements.txt"
          echo "✓ dvc.yml"
          echo "✓ mkdocs.yml"


      # ============================================================
      # 11. VERIFY CONFIGURATION FILES
      # ============================================================

      - name: Verify configuration files
        run: |

          if [ -d configs ]; then
            echo "Configuration directory found."

            find configs -type f -maxdepth 2 -print
          else
            echo "configs directory missing."
            exit 1
          fi


      # ============================================================
      # 12. VERIFY FIGURES
      # ============================================================

      - name: Verify figures
        run: |

          echo "Checking Figures directory..."

          find Figures -type f | sort

          COUNT=$(find Figures -type f | wc -l)

          echo ""
          echo "Number of figure files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No figures found."
            exit 1
          fi

          echo "✓ Figures detected."


      # ============================================================
      # 13. VERIFY NOTEBOOKS
      # ============================================================

      - name: Verify notebooks
        run: |

          echo "Checking Notebooks directory..."

          find Notebooks -type f -name "*.ipynb" | sort

          COUNT=$(find Notebooks -type f -name "*.ipynb" | wc -l)

          echo ""
          echo "Number of notebooks: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "WARNING: No Jupyter notebooks detected."
          else
            echo "✓ Jupyter notebooks detected."
          fi


      # ============================================================
      # 14. VERIFY SCRIPTS
      # ============================================================

      - name: Verify scripts
        run: |

          echo "Checking Scripts directory..."

          find Scripts -type f | sort

          COUNT=$(find Scripts -type f | wc -l)

          echo ""
          echo "Number of script files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "WARNING: No scripts detected."
          else
            echo "✓ Scripts detected."
          fi


      # ============================================================
      # 15. PYTHON SYNTAX CHECK
      # ============================================================

      - name: Check Python syntax
        run: |

          echo "Checking Python files..."

          PY_FILES=$(find Scripts -type f -name "*.py" || true)

          if [ -z "$PY_FILES" ]; then
            echo "No Python scripts found."
          else

            for file in $PY_FILES
            do
              echo "Checking: $file"
              python -m py_compile "$file"
            done

            echo ""
            echo "✓ Python syntax validation passed."

          fi


      # ============================================================
      # 16. JUPYTER NOTEBOOK VALIDATION
      # ============================================================

      - name: Validate notebooks
        run: |

          python - <<'PY'

          import json
          from pathlib import Path

          notebooks = list(Path("Notebooks").rglob("*.ipynb"))

          print("Found", len(notebooks), "notebooks.")

          for nb in notebooks:

              print("Checking:", nb)

              with open(nb, "r", encoding="utf-8") as f:
                  data = json.load(f)

              if "cells" not in data:
                  raise ValueError(f"Invalid notebook: {nb}")

          print("")
          print("✓ Notebook JSON validation passed.")

          PY


      # ============================================================
      # 17. REPRODUCIBILITY METADATA
      # ============================================================

      - name: Verify benchmark metadata
        run: |

          echo "=========================================="
          echo "LICA BENCHMARK METADATA"
          echo "=========================================="

          echo "Title:"
          echo "Preliminary Psychometric Calibration of Large Language Models"
          echo "for Multidimensional L2 Academic Writing Assessment:"
          echo "The LICA Framework"

          echo ""
          echo "Models:"
          echo "GPT-4o"
          echo "Claude 3.5 Sonnet"
          echo "Gemini 1.5 Pro"

          echo ""
          echo "Human benchmark:"
          echo "Human Gold Standard"

          echo ""
          echo "LICA dimensions:"
          echo "Language"
          echo "Ideas"
          echo "Cohesion"
          echo "Academic Appropriateness"

          echo ""
          echo "Zenodo DOI:"
          echo "10.5281/zenodo.23168595"


      # ============================================================
      # 18. FINAL REPRODUCIBILITY CHECK
      # ============================================================

      - name: Final reproducibility verification
        run: |

          echo ""
          echo "===================================================="
          echo "       LICA LLM BENCHMARK REPRODUCIBILITY"
          echo "===================================================="

          echo ""
          echo "Repository structure ............ PASSED"
          echo "requirements.txt ............... PASSED"
          echo "Python environment ............. PASSED"
          echo "Data validation ................ PASSED"
          echo "Score matrix ................... PASSED"
          echo "Core files ..................... PASSED"
          echo "Configuration files ............ PASSED"
          echo "Figures ........................ PASSED"
          echo "Python syntax .................. PASSED"
          echo "Notebook validation ............ PASSED"
          echo "Benchmark metadata ............. PASSED"

          echo ""
          echo "===================================================="
          echo "             REPRODUCIBILITY PASSED"
          echo "===================================================="
