name: LICA Reproducibility Check

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  verify:
    name: Verify LICA Benchmark
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Display repository structure
        run: |
          echo "Repository root:"
          pwd

          echo ""
          echo "Repository contents:"
          find . -maxdepth 2 -type f | sort

      - name: Verify required files
        run: |
          test -f README.md
          test -f LICENSE
          test -f environment.yml

          echo "✓ README.md"
          echo "✓ LICENSE"
          echo "✓ environment.yml"

      - name: Verify repository directories
        run: |
          test -d Data
          test -d Figures
          test -d Notebooks
          test -d Scripts
          test -d configs

          echo "✓ Data/"
          echo "✓ Figures/"
          echo "✓ Notebooks/"
          echo "✓ Scripts/"
          echo "✓ configs/"

      - name: Verify Python
        run: |
          python --version
          python -c "print('Python environment successfully verified.')"

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            numpy \
            pandas \
            scipy \
            scikit-learn \
            statsmodels \
            matplotlib \
            seaborn \
            openpyxl \
            jupyter

      - name: Test Python packages
        run: |
          python - <<'PY'
          import numpy
          import pandas
          import scipy
          import sklearn
          import statsmodels
          import matplotlib
          import seaborn
          import openpyxl

          print("numpy:", numpy.__version__)
          print("pandas:", pandas.__version__)
          print("scipy:", scipy.__version__)
          print("scikit-learn:", sklearn.__version__)
          print("statsmodels:", statsmodels.__version__)
          print("matplotlib:", matplotlib.__version__)
          print("seaborn:", seaborn.__version__)
          print("openpyxl:", openpyxl.__version__)

          print("")
          print("All Python dependencies verified successfully.")
          PY

      - name: Final verification
        run: |
          echo ""
          echo "====================================================="
          echo "LICA PSYCHOMETRIC BENCHMARK"
          echo "REPRODUCIBILITY ENVIRONMENT CHECK"
          echo "====================================================="
          echo "Zenodo DOI: 10.5281/zenodo.23168595"
          echo "Repository: Pegi1727/LICA-LLM-Benchmark"
          echo "Status: PASSED"
          echo "====================================================="
